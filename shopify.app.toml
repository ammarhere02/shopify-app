# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f6ae88cf8f10a7e8c934d26e6ef7d508"
application_url = "https://enrichment-hub.onrender.com"
embedded = true
name = "portfolio-app"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/delete"
  topics = [ "products/delete" ]

# Storefront bridge: https://<shop>/apps/product-badge/<rest> -> <app url>/proxy/<rest>, signed by Shopify.
[app_proxy]
url = "https://enrichment-hub.onrender.com/proxy"
subpath = "product-badge"
prefix = "apps"

[auth]
redirect_urls = [ "https://enrichment-hub.onrender.com/auth/callback" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
