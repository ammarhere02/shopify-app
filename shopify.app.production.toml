# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration


client_id = "f6ae88cf8f10a7e8c934d26e6ef7d508"
name = "portfolio-app"
application_url = "https://enrichment-hub.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/delete"
  topics = [ "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_publications,write_publications"

[auth]
redirect_urls = [
"https://enrichment-hub.onrender.com/auth/callback"
]

[app_proxy]
url = "https://enrichment-hub.onrender.com/proxy"
subpath = "product-badge"
prefix = "apps"
